[package]
name = "deskcat"
version = "0.1.0"
description = "A pixel-art cat that lives on your desktop"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "deskcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
